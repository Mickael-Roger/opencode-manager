name: grafana
version: 1
description: Install the Grafana Cloud CLI (gcx) and configure one or more Grafana instances with their own URL and token.
# Each instance is isolated in gcx's own stack/context configuration. Nothing is
# written to ~/.env, so the OpenCode server stays up and module edits are safe
# while a workspace task is running.
restartServer: false
key: url
prompts:
  - name: url
    label: Grafana instance URL
    type: string
    required: true
  - name: token
    label: Grafana token
    type: secret
    required: true
