name: kubernetes
version: 2
description: Import host kube contexts into the workspace (one entry per context). kubectl, the kubectl-oidc-login plugin, the kube-ovn (kubectl ko) plugin and kubectx are installed when the first context is added.
# Multi-instance: one entry per kube context. Each install writes only
# ~/.kube/config and the kubectl/kubectl-oidc_login/kubectl-ko/kubectx binaries; nothing in ~/.env, so it never bounces
# the OpenCode server and can be edited while a task is running.
restartServer: false
key: context
prompts:
  - name: context
    label: Kube context
    type: string
    required: true
    optionsCommand: list-contexts
